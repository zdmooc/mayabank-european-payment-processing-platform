name: I00 Foundation Guard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required architecture files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            CHANGELOG.md
            docs/architecture/00-context.md
            docs/architecture/01-container.md
            docs/architecture/02-multicluster-kind-target.md
            docs/architecture/03-technology-baseline.md
            docs/architecture/04-java-platform-sdk.md
            docs/sources/ESTREEM_SOLUTION_ARCHITECT_TECH_SIGNAL_2026-09-28.md
            docs/roadmap/I00-I16.md
            docs/evidence/I00-foundation.md
            docs/evidence/INDEX.md
            docs/evidence/I02-I09-api-runtime.md
            docs/evidence/I05-kafka-runtime.md
            docs/evidence/I06-postgresql-runtime.md
            docs/evidence/I15-kind-multicluster.md
            docs/adr/ADR-001-cards-bounded-contexts.md
            docs/adr/ADR-002-state-plane-separation.md
            docs/adr/ADR-003-idempotency.md
            docs/adr/ADR-004-transactional-outbox.md
            docs/adr/ADR-005-inbox-dedup.md
            docs/adr/ADR-006-synthetic-schemes.md
            docs/adr/ADR-007-wero-distinct-rail.md
            docs/adr/ADR-008-postgresql-initial-store.md
            docs/adr/ADR-009-kafka-backbone.md
            docs/adr/ADR-010-openshift-gitops-target.md
            docs/adr/ADR-011-java-platform-sdk.md
            docs/adr/ADR-012-public-tech-signal-adoption.md
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done

      - name: Truth-boundary assertions
        shell: bash
        run: |
          set -euo pipefail
          grep -q "does \*\*not\*\* reproduce Estreem" README.md
          grep -q "Wero remains a \*\*distinct A2A / SCT Inst rail\*\*" README.md
          grep -q "LOCAL SYNTHETIC MULTI_CLUSTER" docs/architecture/02-multicluster-kind-target.md
          grep -q "does \*\*not\*\* reproduce Estreem" README.md
          grep -q "Still \*\*not\*\* runtime-proven" README.md
          grep -q "architecture fidelity > product-logo fidelity" README.md
          grep -q "real CB/Visa/Mastercard network connectivity" README.md
          grep -q "RUNTIME_PROVEN — CI LOCAL SYNTHETIC MULTI_CLUSTER" docs/evidence/INDEX.md
          grep -q "Payment Platform SDK" docs/architecture/04-java-platform-sdk.md

      - name: No obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git '(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,})' .; then
            echo "Potential secret-like material found"
            exit 1
          fi

      - name: I00 result
        run: echo "I00_FOUNDATION_GUARD=PASS"
