apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../openshift/overlays/region-b
images:
  - name: ghcr.io/zdmooc/mayabank-european-payment-processing-platform
    newName: mayabank/payment-processing-api
    newTag: ci
patches:
  - target: {kind: Deployment, name: payment-processing-api}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
